<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐分享</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: radial-gradient(120% 120% at 50% 0%, #1a1a2e 0%, #0d0d12 70%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; color:#fff;
    -webkit-tap-highlight-color:transparent;
  }
  .player {
    width:430px; max-width:92vw; padding:36px 30px 30px;
    background:linear-gradient(165deg,#171722 0%,#101018 100%);
    border:1px solid #2a2a3c; border-radius:28px;
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04);
    text-align:center;
  }
  .brand { font-size:11px; letter-spacing:6px; color:#5f5f7f; margin-bottom:26px; text-transform:uppercase; }
  .cover {
    width:230px; height:230px; margin:0 auto 26px; border-radius:20px;
    background:linear-gradient(135deg,#22223a,#2e2e4a);
    display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 1px #33334c, 0 14px 34px rgba(0,0,0,.5);
    position:relative; overflow:hidden;
  }
  .cover img { width:100%; height:100%; object-fit:cover; border-radius:20px; }
  .cover .ph { width:90px; height:90px; opacity:.85; }
  .title { font-size:21px; font-weight:700; margin-bottom:8px; letter-spacing:.5px; word-break:break-all; }
  .artist { font-size:14px; color:#8a8aaa; margin-bottom:26px; word-break:break-all; }
  .controls { display:flex; align-items:center; justify-content:center; gap:22px; }
  .btn {
    width:56px; height:56px; border-radius:50%;
    background:#1e1e2e; border:1px solid #33334c; color:#fff; cursor:pointer;
    font-size:20px; display:flex; align-items:center; justify-content:center; transition:.18s;
  }
  .btn:active { transform:scale(.94); }
  .btn.main {
    width:74px; height:74px; border:none; font-size:28px;
    background:linear-gradient(135deg,#4fe0ff,#3aa9ff);
    box-shadow:0 10px 28px rgba(60,170,255,.35);
  }
  .time { font-size:12px; color:#6f6f8f; margin-top:20px; font-variant-numeric:tabular-nums; }
  .hint { font-size:11px; color:#55556f; margin-top:14px; }
</style>
</head>
<body>
<div class="player">
  <div class="brand">Mineradio &middot; 音乐分享</div>
  <div class="cover"><img id="cover" alt=""><div class="ph" id="ph">
    <svg viewBox="0 0 100 100" fill="none" stroke="#4fe0ff" stroke-width="4" stroke-linecap="round">
      <circle cx="50" cy="50" r="34"/><path d="M36 63 V37 l30-9 v28" fill="#4fe0ff" stroke="none"/>
    </svg>
  </div></div>
  <div class="title" id="title">未知歌曲</div>
  <div class="artist" id="artist">未知歌手</div>
  <div class="controls">
    <button class="btn" id="prev" onclick="skip(-10)">&#9198;</button>
    <button class="btn main" id="play" onclick="toggle()">&#9654;</button>
    <button class="btn" id="next" onclick="skip(10)">&#9197;</button>
  </div>
  <div class="time" id="time">0:00 / 0:00</div>
  <div class="hint">点击播放按钮开始收听</div>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var title = qs.get('t') || '未知歌曲';
  var artist = qs.get('a') || '';
  var cover = qs.get('c') || '';
  var src = qs.get('u') || '';
  document.getElementById('title').textContent = title;
  document.getElementById('artist').textContent = artist || '未知歌手';
  var ph = document.getElementById('ph'), coverEl = document.getElementById('cover');
  if (cover) { coverEl.src = cover; coverEl.style.display='block'; ph.style.display='none'; }
  var audio = document.getElementById('audio');
  if (src) audio.src = src;
  var playing = false;
  function toggle(){
    if (!audio.src) { return; }
    if (playing){ audio.pause(); document.getElementById('play').innerHTML='&#9654;'; }
    else { audio.play(); document.getElementById('play').innerHTML='&#10074;&#10074;'; }
    playing = !playing;
  }
  function skip(s){ if (audio.src){ audio.currentTime = Math.max(0, Math.min((audio.duration||0), audio.currentTime+s)); } }
  audio.addEventListener('timeupdate', function(){
    var f = function(t){ t = Math.floor(t||0); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); };
    document.getElementById('time').textContent = f(audio.currentTime)+' / '+f(audio.duration);
  });
  audio.addEventListener('error', function(){
    document.getElementById('time').textContent = '音频加载失败，请重新分享';
  });
  document.getElementById('play').onclick = toggle;
  document.getElementById('prev').onclick = function(){ skip(-10); };
  document.getElementById('next').onclick = function(){ skip(10); };
})();
</script>
</body>
</html>
