<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>正在播放</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    color:#fff;background:#07070a;display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;min-height:100vh;
  }
  /* 背景光晕 */
  .glow{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0}
  .glow1{width:500px;height:500px;background:radial-gradient(circle,rgba(80,120,255,.25),transparent 70%);top:-100px;left:50%;transform:translateX(-50%)}
  .glow2{width:400px;height:400px;background:radial-gradient(circle,rgba(180,80,255,.18),transparent 70%);bottom:-80px;left:20%}

  /* 唱针 */
  .tonearm{
    position:relative;z-index:5;width:200px;height:110px;margin-bottom:-30px;margin-left:120px;
    transform-origin:160px 20px;transform:rotate(-38deg);transition:transform .6s cubic-bezier(.4,0,.2,1);
  }
  .tonearm.on{transform:rotate(-12deg)}
  .tonearm svg{width:100%;height:100%;filter:drop-shadow(0 4px 12px rgba(0,0,0,.6))}

  /* 黑胶唱片 */
  .vinyl-wrap{position:relative;z-index:2;width:290px;height:290px;margin:0 auto 36px}
  .vinyl{
    width:100%;height:100%;border-radius:50%;position:relative;
    background:
      radial-gradient(circle at center,#1a1a1a 0%,#1a1a1a 28%,#111 28.5%,#111 30%,#1a1a1a 30.5%,#1a1a1a 32%,#111 32.5%,#111 34%,#1a1a1a 34.5%,#1a1a1a 36%,#111 36.5%,#111 38%,#1a1a1a 38.5%,#1a1a1a 40%,#111 40.5%,#111 42%,#1a1a1a 42.5%,#1a1a1a 44%,#111 44.5%,#111 46%,#1a1a1a 46.5%,#1a1a1a 48%,#111 48.5%,#111 100%);
    box-shadow:0 0 0 1px rgba(255,255,255,.05),0 30px 70px rgba(0,0,0,.7),inset 0 0 40px rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;
  }
  .vinyl.spin{animation:spin 24s linear infinite}
  .vinyl::before{
    content:'';position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.08),transparent 50%);
    pointer-events:none;
  }
  .cover{
    width:130px;height:130px;border-radius:50%;overflow:hidden;position:relative;z-index:2;
    border:3px solid #222;box-shadow:0 0 20px rgba(0,0,0,.5);
  }
  .cover img{width:100%;height:100%;object-fit:cover}
  .cover .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1a2e,#2a2a4a)}
  .cover .ph svg{width:50px;height:50px;opacity:.7}
  .center-hole{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:14px;height:14px;border-radius:50%;background:#07070a;border:2px solid #333;z-index:3;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 信息区 */
  .info{text-align:center;margin-bottom:28px;position:relative;z-index:2}
  .title{font-size:22px;font-weight:600;margin-bottom:8px;letter-spacing:.5px;word-break:break-all}
  .artist{font-size:14px;color:rgba(255,255,255,.4);word-break:break-all}

  /* 进度条 */
  .progress-wrap{width:320px;max-width:85vw;margin:0 auto 10px;cursor:pointer;padding:8px 0;position:relative;z-index:2}
  .progress{height:3px;background:rgba(255,255,255,.12);border-radius:3px;position:relative}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#6a8dff,#b06aff);border-radius:3px;position:relative;transition:width .1s linear}
  .progress-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(140,120,255,.8);opacity:0;transition:opacity .2s}
  .progress-wrap:hover .progress-fill::after{opacity:1}
  .time-row{display:flex;justify-content:space-between;width:320px;max-width:85vw;margin:0 auto 28px;font-size:11px;color:rgba(255,255,255,.35);font-variant-numeric:tabular-nums;position:relative;z-index:2}

  /* 控制按钮 */
  .controls{display:flex;align-items:center;justify-content:center;gap:36px;position:relative;z-index:2}
  .btn{
    width:52px;height:52px;border-radius:50%;border:none;background:transparent;
    color:rgba(255,255,255,.7);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;
    transition:all .2s;
  }
  .btn:hover{color:#fff;transform:scale(1.1)}
  .btn:active{transform:scale(.95)}
  .btn.main{
    width:70px;height:70px;font-size:24px;color:#0a0a0a;
    background:linear-gradient(135deg,#fff,#e0e0e0);
    box-shadow:0 8px 28px rgba(255,255,255,.2);
  }
  .btn.main:hover{box-shadow:0 12px 36px rgba(255,255,255,.3);color:#0a0a0a}

  .hint{font-size:11px;color:rgba(255,255,255,.2);margin-top:24px;position:relative;z-index:2}
</style>
</head>
<body>
<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="tonearm" id="tonearm">
  <svg viewBox="0 0 200 110" fill="none">
    <circle cx="160" cy="20" r="16" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
    <circle cx="160" cy="20" r="6" fill="#111"/>
    <rect x="70" y="16" width="92" height="7" rx="3.5" fill="url(#g1)" transform="rotate(-8 160 20)"/>
    <rect x="58" y="22" width="20" height="28" rx="3" fill="#333" transform="rotate(-8 160 20)"/>
    <rect x="55" y="44" width="10" height="16" rx="2" fill="#888" transform="rotate(-8 160 20)"/>
    <defs><linearGradient id="g1" x1="70" y1="16" x2="162" y2="23" gradientUnits="userSpaceOnUse">
      <stop stop-color="#555"/><stop offset="1" stop-color="#333"/>
    </linearGradient></defs>
  </svg>
</div>

<div class="vinyl-wrap">
  <div class="vinyl" id="vinyl">
    <div class="cover">
      <img id="coverImg" alt="" style="display:none">
      <div class="ph" id="ph">
        <svg viewBox="0 0 100 100" fill="none" stroke="#6a8dff" stroke-width="3.5" stroke-linecap="round">
          <circle cx="50" cy="50" r="32"/><path d="M38 62 V38 l28-8 v26" fill="#6a8dff" stroke="none"/>
        </svg>
      </div>
    </div>
    <div class="center-hole"></div>
  </div>
</div>

<div class="info">
  <div class="title" id="title">未知歌曲</div>
  <div class="artist" id="artist">未知歌手</div>
</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
</div>
<div class="time-row"><span id="curTime">0:00</span><span id="durTime">0:00</span></div>

<div class="controls">
  <button class="btn" id="prevBtn" title="后退10秒">&#9198;</button>
  <button class="btn main" id="playBtn" title="播放/暂停">&#9654;</button>
  <button class="btn" id="nextBtn" title="前进10秒">&#9197;</button>
</div>
<div class="hint" id="hint">点击播放按钮开始收听</div>

<audio id="audio" preload="metadata"></audio>
<script>
(function(){
  var qs=new URLSearchParams(location.search);
  var title=qs.get('t')||'未知歌曲',artist=qs.get('a')||'',cover=qs.get('c')||'',src=qs.get('u')||'';
  document.getElementById('title').textContent=title;
  document.getElementById('artist').textContent=artist||'未知歌手';
  var coverImg=document.getElementById('coverImg'),ph=document.getElementById('ph');
  if(cover){coverImg.src=cover;coverImg.style.display='block';ph.style.display='none'}
  var audio=document.getElementById('audio');if(src)audio.src=src;audio.volume=0.8;
  var playBtn=document.getElementById('playBtn'),vinyl=document.getElementById('vinyl'),tonearm=document.getElementById('tonearm');
  var progressWrap=document.getElementById('progressWrap'),progressFill=document.getElementById('progressFill');
  var curTime=document.getElementById('curTime'),durTime=document.getElementById('durTime'),hint=document.getElementById('hint');
  var playing=false,fmt=function(t){t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
  function toggle(){
    if(!audio.src){hint.textContent='音频加载失败，请重新分享';return}
    if(playing){audio.pause();playBtn.innerHTML='&#9654;';vinyl.classList.remove('spin');tonearm.classList.remove('on')}
    else{audio.play().catch(function(){hint.textContent='无法播放，请检查链接'});playBtn.innerHTML='&#10074;&#10074;';vinyl.classList.add('spin');tonearm.classList.add('on');hint.textContent=''}
    playing=!playing;
  }
  playBtn.onclick=toggle;
  document.getElementById('prevBtn').onclick=function(){if(audio.src)audio.currentTime=Math.max(0,audio.currentTime-10)};
  document.getElementById('nextBtn').onclick=function(){if(audio.src)audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10)};
  audio.addEventListener('timeupdate',function(){var p=audio.duration?(audio.currentTime/audio.duration*100):0;progressFill.style.width=p+'%';curTime.textContent=fmt(audio.currentTime)});
  audio.addEventListener('loadedmetadata',function(){durTime.textContent=fmt(audio.duration)});
  audio.addEventListener('ended',function(){playing=false;playBtn.innerHTML='&#9654;';vinyl.classList.remove('spin');tonearm.classList.remove('on');progressFill.style.width='0%'});
  audio.addEventListener('error',function(){hint.textContent='音频加载失败，请重新分享'});
  function seek(e){if(!audio.duration)return;var r=progressWrap.querySelector('.progress').getBoundingClientRect();var x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;audio.currentTime=Math.max(0,Math.min(1,x/r.width))*audio.duration}
  var drag=false;progressWrap.addEventListener('mousedown',function(e){drag=true;seek(e)});
  document.addEventListener('mousemove',function(e){if(drag)seek(e)});document.addEventListener('mouseup',function(){drag=false});
  progressWrap.addEventListener('touchstart',function(e){seek(e)},{passive:true});progressWrap.addEventListener('touchmove',function(e){seek(e)},{passive:true});
})();
</script>
</body>
</html>
