<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>正在播放</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(120% 80% at 50% 0%, #23233a 0%, #10101c 45%, #08080f 100%);
    position:relative;overflow:hidden;
  }
  /* 星空星点 */
  .star{position:absolute;border-radius:50%;background:#fff;opacity:.5;animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.2}50%{opacity:.8}}
  /* 柔和光晕 */
  .glow{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
  .glow1{width:420px;height:420px;background:rgba(90,120,255,.16);top:-120px;left:50%;transform:translateX(-50%)}
  .glow2{width:360px;height:360px;background:rgba(150,90,255,.10);bottom:-100px;left:15%}

  .main{position:relative;z-index:2;text-align:center;padding:0 30px;margin-top:-20px}
  /* 封面 */
  .cover-wrap{width:250px;height:250px;margin:0 auto 40px;position:relative}
  .cover-wrap::before{
    content:'';position:absolute;inset:-3px;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(120,150,255,.5),rgba(180,120,255,.3),rgba(120,200,255,.5),rgba(120,150,255,.5));
    filter:blur(14px);opacity:.35;z-index:-1;animation:spin 10s linear infinite;
  }
  .cover{
    width:100%;height:100%;border-radius:50%;overflow:hidden;
    background:linear-gradient(135deg,#1e1e32,#2c2c4a);
    box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08);
    display:flex;align-items:center;justify-content:center;
  }
  .cover img{width:100%;height:100%;object-fit:cover}
  .cover .ph{width:84px;height:84px;opacity:.6}
  .cover.playing{animation:spin 18s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .title{font-size:22px;font-weight:600;margin-bottom:10px;letter-spacing:.5px;word-break:break-all;line-height:1.3}
  .artist{font-size:14px;color:rgba(255,255,255,.45);word-break:break-all;letter-spacing:.5px}

  /* 底部控制栏 */
  .control-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:5;
    display:flex;align-items:center;justify-content:center;gap:56px;
    padding:26px 0 calc(26px + env(safe-area-inset-bottom));
    background:rgba(20,20,32,.55);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-top:1px solid rgba(255,255,255,.07);
    box-shadow:0 -10px 40px rgba(0,0,0,.3);
  }
  .btn{
    width:52px;height:52px;border-radius:50%;border:none;background:transparent;
    color:rgba(255,255,255,.85);cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:transform .15s,opacity .15s;
  }
  .btn svg{width:30px;height:30px;fill:currentColor}
  .btn:hover{opacity:1}
  .btn:active{transform:scale(.92)}
  .btn.play{
    width:72px;height:72px;background:rgba(255,255,255,.92);color:#111;
    box-shadow:0 10px 30px rgba(255,255,255,.18);
  }
  .btn.play svg{width:34px;height:34px}
  .btn.play:active{transform:scale(.95)}

  .hint{position:fixed;bottom:110px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.25);z-index:4}
</style>
</head>
<body>
<script>
  // 生成星点
  (function(){
    var n=46;
    for(var i=0;i<n;i++){
      var s=document.createElement('div');
      s.className='star';
      var size=Math.random()*2+1;
      s.style.width=size+'px';s.style.height=size+'px';
      s.style.left=Math.random()*100+'%';
      s.style.top=Math.random()*100+'%';
      s.style.animationDelay=Math.random()*3+'s';
      s.style.animationDuration=(2+Math.random()*3)+'s';
      document.body.appendChild(s);
    }
  })();
</script>
<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="main">
  <div class="cover-wrap">
    <div class="cover" id="cover">
      <img id="coverImg" alt="" style="display:none">
      <div class="ph" id="ph">
        <svg viewBox="0 0 100 100" fill="none" stroke="#8aa0ff" stroke-width="3.5" stroke-linecap="round">
          <circle cx="50" cy="50" r="32"/><path d="M38 62 V38 l28-8 v26" fill="#8aa0ff" stroke="none"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="title" id="title">未知歌曲</div>
  <div class="artist" id="artist">未知歌手</div>
</div>

<div class="hint" id="hint">点击播放</div>

<div class="control-bar">
  <button class="btn" id="prevBtn" title="后退10秒">
    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
  </button>
  <button class="btn play" id="playBtn" title="播放/暂停">
    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <button class="btn" id="nextBtn" title="前进10秒">
    <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
  </button>
</div>

<audio id="audio" preload="metadata"></audio>
<script>
(function(){
  var qs=new URLSearchParams(location.search);
  var title=qs.get('t')||'未知歌曲';
  var artist=qs.get('a')||'';
  var cover=qs.get('c')||'';
  var src=qs.get('u')||'';
  document.getElementById('title').textContent=title;
  document.getElementById('artist').textContent=artist||'';
  var coverImg=document.getElementById('coverImg'),ph=document.getElementById('ph');
  if(cover){coverImg.src=cover;coverImg.style.display='block';ph.style.display='none'}
  var audio=document.getElementById('audio');
  if(src)audio.src=src;
  audio.volume=0.8;
  var playBtn=document.getElementById('playBtn'),playIcon=document.getElementById('playIcon');
  var coverEl=document.getElementById('cover'),hint=document.getElementById('hint');
  var playing=false;
  var playPath='<path d="M8 5v14l11-7z"/>';
  var pausePath='<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  function toggle(){
    if(!audio.src){hint.textContent='音频加载失败，请重新分享';return}
    if(playing){
      audio.pause();
      playIcon.innerHTML=playPath;
      coverEl.classList.remove('playing');
      hint.textContent='已暂停';
    }else{
      audio.play().then(function(){hint.textContent=''}).catch(function(){hint.textContent='无法播放，请检查链接'});
      playIcon.innerHTML=pausePath;
      coverEl.classList.add('playing');
      hint.textContent='';
    }
    playing=!playing;
  }
  playBtn.onclick=toggle;
  document.getElementById('prevBtn').onclick=function(){if(audio.src)audio.currentTime=Math.max(0,audio.currentTime-10)};
  document.getElementById('nextBtn').onclick=function(){if(audio.src)audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10)};
  audio.addEventListener('ended',function(){playing=false;playIcon.innerHTML=playPath;coverEl.classList.remove('playing');hint.textContent='播放完毕'});
  audio.addEventListener('error',function(){hint.textContent='音频加载失败，请重新分享'});
})();
</script>
</body>
</html>
